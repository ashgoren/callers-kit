# Adds YAML Schema support for VSCode users with the YAML extension installed. This enables features like validation and autocompletion based on the provided schema.
# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json

# See https://docs.powersync.com/sync/advanced/compatibility
config:
  edition: 3

# Define Sync Streams to control which data is synced to each user
# Docs: https://docs.powersync.com/sync/streams/overview
streams:
  dances:
    # Each user only syncs their own dances (matches the dances_user_access RLS policy)
    auto_subscribe: true
    query: SELECT * FROM dances WHERE dances.user_id = auth.user_id()

  choreographers:
    # Owner table with its own user_id column, same pattern as dances above
    auto_subscribe: true
    query: SELECT * FROM choreographers WHERE choreographers.user_id = auth.user_id()

  dances_choreographers:
    # Junction table has no user_id of its own - scoped via join to the
    # owning dance's user_id instead, same as the RLS policy on this table.
    # The source table (dances_choreographers) is deliberately left
    # unaliased - aliasing it would sync rows under that alias's name
    # instead of the real table name, breaking the client schema mapping.
    auto_subscribe: true
    query: >
      SELECT dances_choreographers.* FROM dances_choreographers
      JOIN dances ON dances.id = dances_choreographers.dance_id
      WHERE dances.user_id = auth.user_id()
