# Adds YAML Schema support for VSCode users with the YAML extension installed. This enables features like validation and autocompletion based on the provided schema.
# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json

# See https://docs.powersync.com/sync/advanced/compatibility
config:
  edition: 3

# Define Sync Streams to control which data is synced to each user
# Docs: https://docs.powersync.com/sync/streams/overview
streams:
  dances:
    # Each user only syncs their own dances (matches the dances_user_access RLS policy)
    auto_subscribe: true
    query: SELECT * FROM dances WHERE dances.user_id = auth.user_id()

  choreographers:
    # Owner table with its own user_id column, same pattern as dances above
    auto_subscribe: true
    query: SELECT * FROM choreographers WHERE choreographers.user_id = auth.user_id()

  dances_choreographers:
    # Junction table has no user_id of its own - scoped via join to the
    # owning dance's user_id instead, same as the RLS policy on this table.
    # No table aliases in this query - PowerSync attributes synced rows to
    # whatever name follows FROM, alias or not, so aliasing the table being
    # synced would sync its rows under that alias's name instead of the real
    # table name, breaking the client schema mapping. Simplest to never
    # alias anything here rather than track which table that rule applies to.
    auto_subscribe: true
    query: >
      SELECT dances_choreographers.* FROM dances_choreographers
      JOIN dances ON dances.id = dances_choreographers.dance_id
      WHERE dances.user_id = auth.user_id()

  key_moves:
    # Owner table with its own user_id column, same pattern as choreographers above
    auto_subscribe: true
    query: SELECT * FROM key_moves WHERE key_moves.user_id = auth.user_id()

  vibes:
    # Owner table with its own user_id column, same pattern as choreographers above
    auto_subscribe: true
    query: SELECT * FROM vibes WHERE vibes.user_id = auth.user_id()

  dances_key_moves:
    # Junction table has no user_id of its own - scoped via join to the
    # owning dance's user_id instead, same as dances_choreographers above.
    auto_subscribe: true
    query: >
      SELECT dances_key_moves.* FROM dances_key_moves
      JOIN dances ON dances.id = dances_key_moves.dance_id
      WHERE dances.user_id = auth.user_id()

  dances_vibes:
    # Junction table has no user_id of its own - scoped via join to the
    # owning dance's user_id instead, same as dances_choreographers above.
    auto_subscribe: true
    query: >
      SELECT dances_vibes.* FROM dances_vibes
      JOIN dances ON dances.id = dances_vibes.dance_id
      WHERE dances.user_id = auth.user_id()

  user_table_preferences:
    # Per-user table column layout (visibility, sorting, pinning, order,
    # column widths). Has its own user_id column, same pattern as
    # choreographers above - one row per (user_id, table_name).
    auto_subscribe: true
    query: SELECT * FROM user_table_preferences WHERE user_table_preferences.user_id = auth.user_id()
